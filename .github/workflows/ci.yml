name: CI

on:
  pull_request:
    branches: [main]
  # Every branch, not only main: a branch pushed for weeks before its PR would
  # otherwise meet CI for the first time at the PR. Kotlin is still not
  # compiled here.
  push:
    branches: ["**"]

# A PR branch gets two runs per push (push + pull_request); a newer push cancels
# the stale run of the same kind instead of letting both finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces the DCO sign-off promised in CONTRIBUTING.md. Deliberately an
  # inline check instead of a third-party action: it is ~15 lines of git, and a
  # marketplace action would add a supply-chain dependency to every PR.
  # On a PR it checks the PR range; on a push to any other branch, the commits
  # the branch adds on top of main. Not on a push to main itself: main's older
  # history predates the rule and carries no sign-offs.
  dco:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # fetch-depth: 0 — the check walks the PR commit range, which shallow
      # clones do not contain. Still needed on checkout v7: the default is
      # depth 1, and v7's only behaviour change is blocking fork checkouts for
      # pull_request_target / workflow_run, neither of which this workflow uses.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git merge-base origin/main HEAD)"
            HEAD_SHA="$(git rev-parse HEAD)"
          fi
          bash scripts/check_dco.sh "$BASE_SHA" "$HEAD_SHA"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Node 24, not 20: Node 20 went end-of-life in April 2026. It only has to
      # run the pinned pyright below, which is version-pinned separately.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # CI validates the Android code path on a host runner; Android is the only supported runtime target.
      # The `dev` extra pins pytest, pytest-asyncio, ruff and the test-only
      # backends to exact versions (pyproject.toml).
      - run: pip install -e ".[dev]"
      - run: ruff check jenny/ jenny_extensions/ tests/
      # pyright is a static check only (zero runtime impact); config in pyrightconfig.json.
      # BLOCKING: restricted to the already-error-clean subset — must stay green.
      - run: npx --yes pyright@1.1.411 jenny/bus jenny/command jenny/plan jenny/runtime jenny/session jenny/snapshot jenny/gateway_runtime.py jenny/extensions.py jenny_extensions
      # NON-BLOCKING visibility: full perimeter, surfaces residual errors without failing CI.
      - run: npx --yes pyright@1.1.411 || true

  test:
    runs-on: ubuntu-latest
    # La suite sta in ~2 minuti in locale. Il default di GitHub è 360: un test
    # appeso li brucerebbe tutti prima di dire com'è andata.
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      # Node serve a QUESTO job, non solo al lint: una ventina di suite della
      # WebUI eseguono il JS reale con `node` e si SALTANO se manca. Passavano
      # solo perche' l'immagine ubuntu-latest lo include di suo — il giorno che
      # smettesse, ~200 prove sparirebbero in verde. Il guard in
      # tests/webui/test_node_is_available.py fallisce invece di saltare quando
      # `CI` e' impostata, cosi' la sparizione fa rumore.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # CI validates the Android code path on a host runner; Android is the only supported runtime target.
      # L'extra `dev` porta, a versione esatta, pytest, pytest-asyncio, ruff e
      # i backend dei soli test: `cryptography` per il backup cifrato (su
      # Android javax.crypto), `asyncssh` per il server SSH in-process di
      # `ssh_backends/dev.py` (su Android jsch; senza, i tre moduli di test SSH
      # si saltano con `importorskip`, in verde: nessun guard li protegge, a
      # differenza di node/jsdom/Pillow), `pillow` per test_mascot_layer_sources.py.
      # Nessuno dei tre va mai nei requirements Android.
      - run: pip install -e ".[dev]"
      # jsdom non è una dipendenza del repo, ma le suite che montano la casa
      # intera (`tests/support/home_dom.py`) e il contratto del grafo lo
      # richiedono, e senza si saltano in verde. `--no-save`: niente
      # package.json. NODE_PATH (sotto) perché `require` lo trovi da ogni
      # cartella; tests/webui/test_node_is_available.py fallisce in CI se manca.
      # Versione esatta, come le dipendenze Python dell'extra `dev`: senza, ogni
      # giro prendeva l'ultima uscita, e un jsdom nuovo poteva cambiare l'esito
      # delle suite senza che il repo cambiasse. È quella su cui girano in
      # locale; vuole node ^24.15 (v. `engines`), e il job usa il 24.
      - run: npm install --no-save jsdom@30.1.1
      # NON aggiungere `--cov` qui, e non reinstallare `pytest-cov`: la misura
      # perturba ciò che misura. La sandbox di `python_exec` intercetta *tutte*
      # le operazioni su path del processo per la durata di una `execute`,
      # rifiuta quelle fuori dal workspace e le mette a verbale; le letture di
      # path del tracer di coverage cadono in quella finestra, vengono rifiutate
      # come le altre, e le prove che asseriscono un verbale pulito falliscono.
      # Non è aggirabile: allargare l'esenzione della sandbox indebolirebbe un
      # confine di sicurezza su una piattaforma che non spediamo (fuori da
      # Chaquopy `_discover_runtime_path_prefixes` è vuota di proposito);
      # sospendere il tracer attorno a ogni `execute` è stato misurato e va da
      # 122 s a oltre venti minuti; marcare le prove con `no_cover` sposta il
      # problema sulla prima prova non marcata, all'infinito.
      # Il report non aveva consumatori — nessun `fail_under`, nessun badge,
      # nessun servizio esterno — e in cambio ha tenuto questa CI rossa per tre
      # release, cioè ha insegnato a ignorare l'unico segnale che conta. Per
      # vederlo in locale: `pytest -q --cov=jenny`, sapendo che quelle prove
      # della sandbox falliranno e che il motivo è questo.
      # `-n auto`: un processo per core (pytest-xdist, nell'extra `dev`);
      # `worksteal` perché i file jsdom sono pochi e lunghi, e con la
      # distribuzione di default un processo resta con la coda. `--durations`
      # mette nel log i test più lenti: uno nuovo si vede, invece di sommarsi.
      - run: pytest -q -n auto --dist worksteal --durations=25
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules
