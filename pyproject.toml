[project]
name = "jenny"
version = "1.0.0"
description = "Jenny - AI agent framework (fork of nanobot)"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "flagdizero"},
    {name = "Xubin Ren"},
    {name = "the nanobot contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

dependencies = [
    "httpx>=0.28.0,<1.0.0",
    "websockets>=16.0,<17.0.0",
    "loguru>=0.7.3,<1.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "filelock>=3.25.2,<4.0.0",
    "markdown>=3.5,<4.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "pyyaml>=6.0,<7.0.0",
    "typing-extensions>=4.0.0,<5.0.0",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
# Solo sviluppo e CI (`pip install -e ".[dev]"`), mai nell'APK: Chaquopy installa
# `requirements-android.lock.txt`, non questo elenco. Versioni esatte perche' un
# rilascio nuovo di ruff o pytest non cambi l'esito della CI senza un commit.
# `asyncssh` alza il server SSH in-process dei test (su Android c'e' jsch),
# `cryptography` fa da backend ai test del backup cifrato (su Android
# javax.crypto), `pillow` serve a tests/webui/test_mascot_layer_sources.py.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.18",
    "asyncssh==2.24.0",
    "cryptography==50.0.1",
    "pillow==12.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [
    "jenny/**/*.py",
    "jenny/templates/**/*.md",
    "jenny/skills/**/*.md",
    "jenny/skills/**/*.py",
    "jenny/templates/ui/**/*",
    "jenny_extensions/**/*.py",
    "jenny_extensions/**/ui/**/*",
]

[tool.hatch.build.targets.wheel]
# ``jenny_extensions`` sta accanto a ``jenny`` (``jenny/extensions.py``): nell'APK
# entra solo nel flavor ``play``, qui c'è perché test e strumenti lo vedano.
packages = ["jenny", "jenny_extensions"]

[tool.hatch.build.targets.wheel.sources]
"jenny" = "jenny"

[tool.hatch.build.targets.sdist]
include = [
    "jenny/",
    "jenny_extensions/",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# ``strict-markers``: un marker non registrato è un errore, non un avviso.
# Verificato: senza, ``@pytest.mark.skpif`` non salta il test — lo **esegue**, e
# passa, riportando come verificato qualcosa che non lo è.
#
# ``strict-config`` promuove a errore gli avvisi che escono leggendo questa
# sezione. Provato a rompere una chiave (``testpath`` per ``testpaths``): su
# pytest 9.1.1 non emette avviso, quindi qui non scatta. Resta perché costa zero
# e copre gli avvisi che *vengono* emessi — non perché sia stato dimostrato su
# questo albero.
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["jenny"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
