     wizard, verso la casa. Non c'e' un dock ne' una fila di pagine, quindi
     non c'e' niente da bloccare mentre lo si compila.

     Stessa CSP dei due gusci (`_SHELL_DOCUMENTS` in jenny/webui/ws_http.py):
     nessuno script inline. -->
