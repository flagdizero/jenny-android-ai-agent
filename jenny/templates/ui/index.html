<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jenny</title>

<!-- Il guscio della casa. Serve una conversazione e nient'altro: qui dentro non
     entrano CodeMirror, KaTeX, Mermaid, D3 e highlight.js, che l'officina carica
     perche' le servono davvero. La differenza non e' estetica — e' il tempo che
     passa fra il tocco sull'icona e la prima riga leggibile.

     Vale la stessa CSP dell'officina (`script-src 'self'`, v. _SHELL_DOCUMENTS
     in jenny/webui/ws_http.py): nessuno script inline, nemmeno per il tema. -->

<!-- Pre-render: tema, lingua e taglia della mascotte prima del primo paint.
     Senza defer e in <head>, come nell'officina: e' l'unico modo perche' giri
     prima che il body si disegni. Lo stesso file, non una copia. -->
<script src="/html-mobile/assets/bootstrap.js"></script>

<link href="/html-mobile/assets/vendor/fonts/google-fonts.css" rel="stylesheet">
<link href="/html-mobile/assets/vendor/fonts/theme-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/html-mobile/assets/vendor/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<!-- Markdown e sanificazione: le risposte di Jenny sono markdown anche in casa.
     Sono le due sole librerie che il guscio si porta dietro. -->
<script src="/html-mobile/assets/vendor/marked@15.0.7/marked.min.js" defer></script>
<script src="/html-mobile/assets/vendor/dompurify@3/purify.min.js" defer></script>

<!-- I token di colore dei sette temi stanno in mobile-style.css, che e' anche il
     foglio dell'officina. La casa ne usa solo le variabili, e disegna il proprio
     con casa-style.css. -->
<link rel="stylesheet" href="/html-mobile/assets/mobile-style.css">
<link rel="stylesheet" href="/html-mobile/assets/casa-style.css">
</head>
<body class="casa">

<main class="casa-shell" data-view="chat">

  <!-- L'intestazione della tavola `Main.dc.html`, ridotta a cio' che esiste.
       Il titolo porta il chevron e apre «con chi parli»: la tendina che dice
       con quale conversazione stai parlando e quali quaderni ci sono. Il
       bottone a destra e' la porta per l'officina — nel disegno finale
       portera' a «Tu e Jenny», che quella porta se la tiene in fondo; finche'
       quella pagina non c'e', porta dritto dove deve portare, e l'icona lo
       dice.

       Il bottone sta *dentro* l'h1 e non attorno: un <button> accetta solo
       contenuto di frase, quindi un h1 dentro un bottone non e' markup valido
       — al contrario, ed e' l'unico modo di avere sia il titolo che il
       comando. -->
  <header class="casa-head">
    <div class="casa-title">
      <div class="casa-kicker" id="casa-kicker"></div>
      <!-- Nelle pagine l'occhiello e' la via d'uscita in alto. Un bottone a
           parte e non l'occhiello travestito: quello e' una parola, questo e'
           un comando, e un <div> con un gestore sopra e' un comando che la
           tastiera non trova. -->
      <button class="casa-back" id="casa-back" type="button" hidden>
        <i class="ti ti-chevron-left" aria-hidden="true"></i>
        <span id="casa-back-label"></span>
      </button>
      <h1>
        <button class="casa-who-open" id="casa-who" type="button"
                aria-haspopup="dialog" aria-expanded="false">
          <!-- Il pallino del quaderno aperto: stesso colore della sua riga nel
               pannello, ed e' l'unica cosa che lega il tocco alla stanza in cui
               sei finito. Nella conversazione personale non c'e': quella non e'
               un quaderno fra i quaderni. -->
          <span class="casa-who-dot casa-title-dot" id="casa-who-dot" hidden></span>
          <span class="casa-who-name">Jenny</span>
          <i class="ti ti-chevron-down" aria-hidden="true"></i>
        </button>
      </h1>
    </div>
    <!-- Cosa si puo' fare da qui. Cambia con la stanza: dalla chat di un
         quaderno si entra nelle sue pagine; dalle pagine si torna a parlarne.
         Sono due bottoni e non uno che cambia mestiere, perche' il mestiere lo
         dice l'icona e un bottone che ne cambia due volte non lo dice piu'. -->
    <div class="casa-actions">
      <button class="casa-pages-open" id="casa-pages-open" type="button" hidden>
        <i class="ti ti-book" aria-hidden="true"></i>
        <span id="casa-pages-count"></span>
      </button>
      <!-- L'avatar: apre «Tu e Jenny». **Tocco lungo per l'officina**, che e'
           la scorciatoia che la tavola scrive sulla scheda in fondo a quella
           pagina — «oppure tieni premuto l'avatar». Fino al 19/09/2026 questo
           bottone era una chiave inglese e portava dritto in officina; adesso
           l'officina sta dove la tavola la mette, e resta a un tocco lungo da
           qui per chi ci va dieci volte al giorno. -->
      <button class="casa-door" id="casa-door" type="button" aria-label="Tu e Jenny">
        <i class="ti ti-user"></i>
      </button>
      <!-- Dalle pagine: torna a parlarne. La tavola qui disegna il segno di
           Jenny; in casa quel segno e' il fiore, ed e' identita' — su un
           comando ci va l'icona di cio' che il comando fa. -->
      <button class="casa-talk" id="casa-talk" type="button" hidden>
        <i class="ti ti-message" aria-hidden="true"></i>
        <span id="casa-talk-label"></span>
      </button>
    </div>
  </header>

  <!-- La conversazione. Un solo filo, dall'alto verso il basso. -->
  <div class="casa-thread" id="casa-thread"></div>

  <!-- Lo stato vuoto sta FUORI dal filo, sovrapposto. Dentro sarebbe il primo
       figlio, e il primo figlio del filo porta il `margin-top:auto` che tiene
       una conversazione corta appoggiata al fondo: un nodo nascosto se lo
       prenderebbe lui, e i messaggi resterebbero incollati in cima. -->
  <div class="casa-empty" id="casa-empty" hidden>
    <div class="casa-empty-text" id="casa-empty-text"></div>
  </div>

  <!-- La riga di lavoro: cosa sta facendo Jenny, mentre lo fa. Tocco lungo per
       aprire lo stesso turno in officina, con pensieri, strumenti e tempi. -->
  <div class="casa-activity" id="casa-activity" hidden></div>

  <!-- Lo stato del filo: compare solo quando c'e' qualcosa da dire (rete giu',
       riconnessione). A filo funzionante non occupa spazio. -->
  <div class="casa-wire" id="casa-wire" hidden></div>

  <!-- Gli allegati in attesa di partire. Vuoto non occupa spazio. -->
  <div class="casa-pending" id="casa-pending" hidden></div>

  <div class="casa-composer">
    <label class="casa-field">
      <textarea class="casa-input" id="casa-input" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
      <button class="casa-attach" id="casa-attach" type="button" aria-label="Allega">
        <i class="ti ti-paperclip"></i>
      </button>
    </label>
    <button class="casa-send" id="casa-send" type="button" aria-label="Manda">
      <i class="ti ti-arrow-up"></i>
    </button>
  </div>

  <!-- ── La seconda stanza: le pagine di un quaderno ──────────────────────
       Wiki, grafo e progetti sono una cosa sola (v. la tavola `Concetto`), e
       questa e' quella cosa: due linguette sopra la stessa risposta del
       server — `/api/graph` porta nodi, archi e indice full-text insieme. -->
  <section class="casa-pages" id="casa-pages">
    <div class="casa-tabs" role="tablist">
      <button class="casa-tab is-on" id="casa-tab-list" type="button"
              role="tab" aria-selected="true" aria-controls="casa-page-list"></button>
      <button class="casa-tab" id="casa-tab-map" type="button"
              role="tab" aria-selected="false" aria-controls="casa-map"></button>
    </div>

    <label class="casa-search" for="casa-pages-q">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input class="casa-search-input" id="casa-pages-q" type="search"
             autocomplete="off" autocapitalize="none" spellcheck="false">
    </label>

    <!-- La nota sta **prima** dell'elenco: l'elenco e' `flex: 1`, quindi da
         vuoto si prende tutta l'altezza e spingerebbe «nessuna pagina con
         queste parole» sul bordo inferiore, dove sembra un piede di pagina
         invece che la risposta alla ricerca appena fatta. -->
    <div class="casa-pages-note" id="casa-pages-note" hidden></div>

    <div class="casa-page-list" id="casa-page-list" role="tabpanel"
         aria-labelledby="casa-tab-list"></div>

    <div class="casa-map" id="casa-map" role="tabpanel"
         aria-labelledby="casa-tab-map" hidden>
      <svg class="casa-map-svg" id="casa-map-svg" aria-hidden="true"></svg>
      <div class="casa-map-note" id="casa-map-note" hidden></div>
    </div>
  </section>

  <!-- ── La terza stanza: una pagina ──────────────────────────────────────
       L'HTML lo rende gia' il server (`/api/page`); qui si sanifica e si
       cablano i wikilink, che aprono un'altra pagina dello stesso quaderno.
       Audit, briciole di pane e LaTeX restano dell'officina. -->
  <section class="casa-reader" id="casa-reader">
    <article class="casa-reader-body" id="casa-reader-body"></article>
  </section>

  <!-- ── La quarta stanza: «Tu e Jenny» ───────────────────────────────────
       Le impostazioni di chi la usa, non di chi la costruisce: la tavola
       `TuEJenny.dc.html`. Righe da 42 px, e ognuna dice a destra **come sta
       adesso** — una riga che non porta il suo valore e' un collegamento, non
       un'impostazione.

       **La lingua non c'e', ed e' una decisione.** Quella riga cambierebbe le
       scritte dei bottoni, non la lingua di Jenny: quella viene da `SOUL.md`,
       da `USER.md` e dal modello. La segue il sistema, che e' cio' che
       `i18n.detectLocale()` fa gia' quando nessuno ha scelto. Misure e ragioni
       in `.agent/casa-tu-e-jenny-plan.md`. -->
  <section class="casa-tu" id="casa-tu">
    <div class="casa-tu-scroll">

      <!-- Il tema non apre una stanza: si tocca e c'e'. E' l'unica impostazione
           della casa il cui effetto e' tutto a schermo, e mandarla a scegliere
           altrove vorrebbe dire sceglierla senza vederla. -->
      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-palette" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-theme-label"></span>
          <span class="casa-card-value" id="casa-theme-value"></span>
        </div>
        <div class="casa-themes" id="casa-themes" role="radiogroup"></div>
        <div class="casa-card-note" id="casa-theme-desc"></div>
      </div>

      <!-- Lei. La riga dice come sta adesso — «piccola · flottante» — perche'
           una riga che non porta il suo valore e' un collegamento. -->
      <div class="casa-rows">
        <!-- Chi risponde. La riga porta la **marca**, non l'id del modello:
             un id sta fra i venti e i trenta caratteri e in questa riga ci
             starebbe troncato, che e' l'errore gia' pagato una volta sulle
             pastiglie dei temi. L'id sta dentro, dove c'e' larghezza. -->
        <button class="casa-row" id="casa-row-model" type="button">
          <i class="ti ti-message-2" aria-hidden="true"></i>
          <span class="casa-row-label" id="casa-model-label"></span>
          <span class="casa-row-value" id="casa-model-value"></span>
          <i class="ti ti-chevron-right casa-row-go" aria-hidden="true"></i>
        </button>
        <button class="casa-row" id="casa-row-jenny" type="button">
          <i class="ti ti-flower" aria-hidden="true"></i>
          <span class="casa-row-label" id="casa-jenny-label"></span>
          <span class="casa-row-value" id="casa-jenny-value"></span>
          <i class="ti ti-chevron-right casa-row-go" aria-hidden="true"></i>
        </button>
      </div>

      <!-- L'officina non sparisce: scende in fondo, come nella tavola. -->
      <button class="casa-workshop" id="casa-workshop" type="button">
        <i class="ti ti-tool" aria-hidden="true"></i>
        <span class="casa-workshop-text">
          <span class="casa-workshop-name" id="casa-workshop-name"></span>
          <span class="casa-workshop-hint" id="casa-workshop-hint"></span>
        </span>
        <i class="ti ti-chevron-right casa-row-go" aria-hidden="true"></i>
      </button>

      <!-- La versione, e nient'altro: il giro di aggiornamento e' dell'officina.
           Un numero che non c'e' non si finge con uno zero — la riga resta
           vuota, e vuota non occupa. -->
      <div class="casa-version" id="casa-version" hidden></div>
    </div>
  </section>

  <!-- ── La quinta stanza: «Jenny» ────────────────────────────────────────
       Com'e' fatta — quanto e' grande, se si vede, se sta sopra le altre app.
       La classe e' `casa-jenny-room` e non `casa-jenny`: quella e' lo sprite
       di lei, che vive nel guscio da prima di questa stanza. -->
  <section class="casa-jenny-room" id="casa-jenny-room">
    <div class="casa-tu-scroll">
      <div class="casa-rows">
        <div class="casa-row">
          <span class="casa-row-label" id="casa-jenny-visible-label"></span>
          <button class="casa-switch" id="casa-jenny-visible" type="button" role="switch">
            <span class="casa-switch-knob"></span>
          </button>
        </div>
        <div class="casa-row casa-row-stack">
          <span class="casa-row-label" id="casa-jenny-size-label"></span>
          <div class="casa-seg" id="casa-jenny-size" role="radiogroup"></div>
        </div>
        <!-- La finestra che sta sopra le altre app. Fuori da Android non puo'
             esistere, e la riga non c'e': `available` lo dice il server. -->
        <div class="casa-row" id="casa-jenny-floating-row" hidden>
          <span class="casa-row-label" id="casa-jenny-floating-label"></span>
          <button class="casa-switch" id="casa-jenny-floating" type="button" role="switch">
            <span class="casa-switch-knob"></span>
          </button>
        </div>
        <!-- La spiegazione sta **dentro** la scheda e non sotto: fuori sarebbe
             testo nudo, e a taglia grande le finirebbe addosso — le schede le
             passano davanti perche' sono opache, una riga di testo no. -->
        <div class="casa-card-note" id="casa-jenny-floating-note" hidden></div>
      </div>

      <!-- Chi e'. Non e' `SOUL.md` intero: e' **la tua parte** di quel file.
           Il resto lo tiene Dream, che lo riscrive circa una volta al giorno
           (misurato, v. `agent/soul_rules.py`) — quindi quel che scrivi qui
           vive altrove, in un file che nessuna passata puo' toccare, e dentro
           `SOUL.md` ne resta una copia rifatta dopo ogni passata. -->
      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-quote" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-rules-label"></span>
          <button class="casa-save" id="casa-rules-save" type="button" hidden></button>
        </div>
        <textarea class="casa-rules" id="casa-rules" rows="4" maxlength="2000"
                  autocapitalize="sentences" spellcheck="false"></textarea>
        <div class="casa-card-note" id="casa-rules-note"></div>
      </div>
    </div>
  </section>

  <!-- ── La sesta stanza: «Chi risponde» ─────────────────────────────────
       Le marche configurate, la chiave di quella guardata, e i modelli che
       quella marca dichiara. La tavola `Modello.dc.html`.

       **Toccare una mattonella non cambia chi risponde**: mostra i suoi
       modelli. Il cambio e' il tocco su un modello, e salva modello e
       provider **insieme** — v. `casa-model.js`. -->
  <section class="casa-model-room" id="casa-model-room">
    <div class="casa-tu-scroll">

      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-message-2" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-providers-label"></span>
          <span class="casa-card-value" id="casa-providers-value"></span>
        </div>
        <div class="casa-brands" id="casa-providers" role="radiogroup"></div>

        <!-- La chiave della marca **guardata**. Il suggerimento offuscato
             arriva dal server; la chiave vera non torna mai al client, quindi
             il campo parte vuoto e quel che non riscrivi resta com'e'. -->
        <div class="casa-key" id="casa-key-row" hidden>
          <span class="casa-key-label" id="casa-key-label"></span>
          <span class="casa-key-hint" id="casa-key-hint"></span>
          <button class="casa-key-btn" id="casa-key-btn" type="button"></button>
        </div>
        <div class="casa-key-edit" id="casa-key-edit" hidden>
          <input class="casa-key-input" id="casa-key-input" type="password"
                 autocomplete="off" autocapitalize="none" spellcheck="false">
          <button class="casa-save" id="casa-key-save" type="button"></button>
        </div>
      </div>

      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-cpu" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-models-label"></span>
        </div>
        <div class="casa-models" id="casa-models" role="radiogroup"></div>
        <div class="casa-card-note" id="casa-models-note" hidden></div>
      </div>

      <!-- Alcuni cambi valgono dal turno dopo, altri vogliono un riavvio: lo
           dice il payload, e va detto invece di lasciarlo indovinare. -->
      <div class="casa-card-note is-warn" id="casa-model-restart" hidden></div>
    </div>
  </section>

</main>

<script type="module" src="/html-mobile/assets/casa-app.js"></script>
</body>
</html>
