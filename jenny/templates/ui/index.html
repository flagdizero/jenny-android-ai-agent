<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jenny</title>

<!-- Il guscio della casa. Serve una conversazione e nient'altro: qui dentro non
     entrano CodeMirror, KaTeX, Mermaid, D3 e highlight.js, che l'officina carica
     perche' le servono davvero. La differenza non e' estetica — e' il tempo che
     passa fra il tocco sull'icona e la prima riga leggibile.

     Vale la stessa CSP dell'officina (`script-src 'self'`, v. _SHELL_DOCUMENTS
     in jenny/webui/ws_http.py): nessuno script inline, nemmeno per il tema. -->

<!-- Pre-render: tema, lingua e taglia della mascotte prima del primo paint.
     Senza defer e in <head>, come nell'officina: e' l'unico modo perche' giri
     prima che il body si disegni. Lo stesso file, non una copia. -->
<script src="/html-mobile/assets/bootstrap.js"></script>

<link href="/html-mobile/assets/vendor/fonts/google-fonts.css" rel="stylesheet">
<link href="/html-mobile/assets/vendor/fonts/theme-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/html-mobile/assets/vendor/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<!-- Markdown e sanificazione: le risposte di Jenny sono markdown anche in casa.
     Sono le due sole librerie che il guscio si porta dietro. -->
<script src="/html-mobile/assets/vendor/marked@15.0.7/marked.min.js" defer></script>
<script src="/html-mobile/assets/vendor/dompurify@3/purify.min.js" defer></script>

<!-- I token di colore dei sette temi stanno in mobile-style.css, che e' anche il
     foglio dell'officina. La casa ne usa solo le variabili, e disegna il proprio
     con casa-style.css. -->
<link rel="stylesheet" href="/html-mobile/assets/mobile-style.css">
<link rel="stylesheet" href="/html-mobile/assets/casa-style.css">
</head>
<body class="casa">

<main class="casa-shell" data-view="chat" data-pagina="chat">

  <!-- ── La fila delle pagine ─────────────────────────────────────────────
       I nomi delle pagine, quella dove sei grande: prende il posto del titolo
       «Jenny ⌄», dell'ingranaggio, del bottone del cassetto e dei pallini
       (v. `.agent/pagine-in-alto-plan.md`). La disegna `casa-fila.js`; c'e'
       solo nella conversazione e nelle sue pagine di lato, le stanze hanno
       l'intestazione qui sotto. Tenere premuto un nome apre la modalita'
       ordina. -->
  <div class="casa-fila" id="casa-fila"></div>

  <!-- L'intestazione delle stanze — le pagine di un quaderno, il lettore, le
       stanze delle impostazioni. Nella conversazione non c'e': li' la fila dice
       gia' dove sei. Qui dice dove sei **e da dove si torna**: l'occhiello e'
       la via d'uscita, e i comandi a destra cambiano con la stanza.

       Il titolo non apre piu' niente, quindi non e' piu' un bottone: la tendina
       delle conversazioni e' diventata la pagina Quaderni. -->
  <header class="casa-head">
    <div class="casa-title">
      <!-- Un bottone a parte e non l'occhiello travestito: quello e' una
           parola, questo e' un comando, e un <div> con un gestore sopra e' un
           comando che la tastiera non trova. -->
      <button class="casa-back" id="casa-back" type="button">
        <i class="ti ti-chevron-left" aria-hidden="true"></i>
        <span id="casa-back-label"></span>
      </button>
      <h1><span class="casa-head-name" id="casa-head-name">Jenny</span></h1>
    </div>
    <div class="casa-actions">
      <!-- Dalle pagine: torna a parlarne. -->
      <button class="casa-talk" id="casa-talk" type="button" hidden>
        <i class="ti ti-message" aria-hidden="true"></i>
        <span id="casa-talk-label"></span>
      </button>
      <!-- Dal lettore: correggi tu, adesso. Compare solo li', e sparisce
           mentre l'editor e' aperto — da quel momento i comandi sono Salva e
           Annulla, e stanno in basso. -->
      <button class="casa-edit" id="casa-edit" type="button" hidden>
        <i class="ti ti-pencil" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <!-- ── La pista delle pagine ────────────────────────────────────────────
       La casa e' un launcher: una fila di pagine. **Quattro ci sono sempre**
       — App, la chat, Quaderni, Impostazioni — e i loro pannelli stanno qui
       nell'HTML; quelle che l'utente aggiunge le crea `casa-pagine.js`. Tutte
       si spostano, la chat compresa, e l'ordine in cui compaiono qui sotto e'
       solo quello di chi non ha mai spostato niente.

       La fila e l'intestazione restano **fuori** dalla pista, ed e' una
       scelta: sono cromatura del guscio, e duplicarle in ogni pannello
       vorrebbe dire tenerne N allineate.

       Le stanze (`casa-pages`, `casa-reader`, …) restano sorelle della pista
       e le passano sopra: entrare in una stanza copre le pagine, non le
       sposta. -->
  <div class="casa-vetrina">
    <div class="casa-pista" id="casa-pista">
    <!-- La pagina App: il cassetto delle app, che fino al 23/09/2026 era un
         foglio che saliva dalla barra dove scrivi. Stesso codice
         (`mobile-launcher.js`, in modalita' incorporata) e stessi id, quindi
         ricerca, classifica e schede sono quelle di sempre; mancano solo le
         cose di un foglio — maniglia, velo, ✕. -->
    <div class="casa-pagina" data-pagina="app">
      <div class="casa-cassetto" id="launcher-sheet" tabindex="-1">
        <div class="launcher-search-row">
          <i class="ti ti-search launcher-search-icon"></i>
          <input class="launcher-search" id="launcher-search" type="text"
                 autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
                 enterkeyhint="go" role="combobox" aria-controls="launcher-list"
                 aria-expanded="false" aria-autocomplete="list" aria-haspopup="listbox"
                 placeholder="Cerca un'app…" data-i18n-placeholder="launcher.searchPlaceholder"
                 aria-label="Cerca app, skill…" data-i18n-aria="launcher.searchPlaceholder">
          <button class="launcher-search-clear" id="launcher-search-clear" type="button"
                  aria-label="Pulisci" data-i18n-aria="launcher.clearSearch"><i class="ti ti-x"></i></button>
        </div>
        <div class="launcher-status" id="launcher-status" role="status" hidden>
          <i class="ti ti-alert-triangle launcher-status-icon" aria-hidden="true"></i>
          <span class="launcher-status-text" data-i18n="launcher.loadFailed">Elenco incompleto: qualcosa non ha risposto.</span>
          <button class="launcher-status-retry" id="launcher-status-retry" type="button"
                  data-i18n="launcher.retry">Riprova</button>
        </div>
        <div class="launcher-head">
          <span class="launcher-title" id="launcher-title" data-i18n="launcher.recent">Più usate</span>
        </div>
        <div class="launcher-list" id="launcher-list" role="listbox"
             aria-label="Risultati" data-i18n-aria="launcher.resultsList"></div>
      </div>
    </div>
    <div class="casa-pagina" data-pagina="chat">
      <!-- La chat vera, in un involucro solo: e' una, e si **sposta** intera
           nella pagina di un quaderno quando ci arrivi (v. `casa-trasloco.js`).
           Non si copia mai — i controller la prendono per id — e nelle pagine
           che non abita c'e' la sua foto. -->
      <div class="casa-chat" id="casa-chat">
      <!-- La conversazione. Un solo filo, dall'alto verso il basso. -->
      <div class="casa-thread" id="casa-thread"></div>

      <!-- Lo stato vuoto sta FUORI dal filo, sovrapposto. Dentro sarebbe il primo
           figlio, e il primo figlio del filo porta il `margin-top:auto` che tiene
           una conversazione corta appoggiata al fondo: un nodo nascosto se lo
           prenderebbe lui, e i messaggi resterebbero incollati in cima. -->
      <div class="casa-empty" id="casa-empty" hidden>
        <div class="casa-empty-text" id="casa-empty-text"></div>
      </div>

      <!-- La riga di lavoro: cosa sta facendo Jenny, mentre lo fa. Tocco lungo per
           aprire lo stesso turno in officina, con pensieri, strumenti e tempi. -->
      <div class="casa-activity" id="casa-activity" hidden></div>

      <!-- Lo stato del filo: compare solo quando c'e' qualcosa da dire (rete giu',
           riconnessione). A filo funzionante non occupa spazio. -->
      <div class="casa-wire" id="casa-wire" hidden></div>

      <!-- Gli allegati in attesa di partire. Vuoto non occupa spazio. -->
      <div class="casa-pending" id="casa-pending" hidden></div>

      <div class="casa-composer">
        <!-- Le pagine del quaderno in cui sei. Stava in testa, accanto al titolo;
             la testa e' diventata la fila delle pagine, e la pastiglia e' scesa
             qui, al posto che era del bottone del cassetto — il cassetto oggi e'
             la pagina App. Compare solo dentro un quaderno. -->
        <button class="casa-pages-open" id="casa-pages-open" type="button" hidden>
          <i class="ti ti-book" aria-hidden="true"></i>
          <span id="casa-pages-count"></span>
        </button>
        <label class="casa-field">
          <textarea class="casa-input" id="casa-input" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
          <button class="casa-attach" id="casa-attach" type="button" aria-label="Allega">
            <i class="ti ti-paperclip"></i>
          </button>
        </label>
        <button class="casa-send" id="casa-send" type="button" aria-label="Manda">
          <i class="ti ti-arrow-up"></i>
        </button>
      </div>
      </div>
    </div>
    <!-- La pagina Quaderni: «Con chi parli», che era la tendina del titolo. La
         disegna `casa-who.js` qui dentro invece che in un `<dialog>`. -->
    <div class="casa-pagina" data-pagina="quaderni">
      <div class="casa-quaderni" id="casa-quaderni"></div>
      <!-- «Nuovo quaderno»: un + tondo che resta fermo mentre l'elenco scorre.
           Era una riga in fondo all'elenco, e con tanti quaderni finiva sotto il
           bordo. Fuori da `#casa-quaderni` apposta: quello scorre, e il
           pannello no. -->
      <button class="casa-quaderni-nuovo" id="casa-quaderni-nuovo" type="button"
              aria-label="Nuovo quaderno">
        <i class="ti ti-plus" aria-hidden="true"></i>
      </button>
    </div>
    <div class="casa-pagina" data-pagina="impostazioni">
      <!-- La pagina Impostazioni: «Tu e Jenny», che fino al 23/09/2026 era una
           stanza dietro l'ingranaggio. E' **nell'HTML del pannello** e non
           prestata a runtime: il prestito delle stanze alle pagine era il pezzo
           fragile del 22-23/09, e una pagina fissa non ne ha bisogno.

         Le impostazioni di chi la usa, non di chi la costruisce: la tavola
         `TuEJenny.dc.html`. Righe da 42 px, e ognuna dice a destra **come sta
         adesso** — una riga che non porta il suo valore e' un collegamento, non
         un'impostazione.

         **La lingua non c'e', ed e' una decisione.** Quella riga cambierebbe le
         scritte dei bottoni, non la lingua di Jenny: quella viene da `SOUL.md`,
         da `USER.md` e dal modello. La segue il sistema, che e' cio' che
         `i18n.detectLocale()` fa gia' quando nessuno ha scelto. Misure e ragioni
         in `.agent/casa-tu-e-jenny-plan.md`. -->
    <section class="casa-tu" id="casa-tu">
      <div class="casa-tu-scroll">

        <!-- Il tema non apre una stanza: si tocca e c'e'. E' l'unica impostazione
             della casa il cui effetto e' tutto a schermo, e mandarla a scegliere
             altrove vorrebbe dire sceglierla senza vederla. -->
        <div class="casa-card">
          <div class="casa-card-head">
            <i class="ti ti-palette" aria-hidden="true"></i>
            <span class="casa-card-label" id="casa-theme-label"></span>
            <span class="casa-card-value" id="casa-theme-value"></span>
          </div>
          <div class="casa-themes" id="casa-themes" role="radiogroup"></div>
          <div class="casa-card-note" id="casa-theme-desc"></div>
        </div>

        <!-- Lei. La riga dice come sta adesso — «piccola · flottante» — perche'
             una riga che non porta il suo valore e' un collegamento. -->
        <div class="casa-rows">
          <!-- Chi risponde. La riga porta la **marca**, non l'id del modello:
               un id sta fra i venti e i trenta caratteri e in questa riga ci
               starebbe troncato, che e' l'errore gia' pagato una volta sulle
               pastiglie dei temi. L'id sta dentro, dove c'e' larghezza. -->
          <button class="casa-row" id="casa-row-model" type="button">
            <i class="ti ti-message-2" aria-hidden="true"></i>
            <span class="casa-row-label" id="casa-model-label"></span>
            <span class="casa-row-value" id="casa-model-value"></span>
            <i class="ti ti-chevron-right casa-row-go" aria-hidden="true"></i>
          </button>
          <button class="casa-row" id="casa-row-jenny" type="button">
            <i class="ti ti-flower" aria-hidden="true"></i>
            <span class="casa-row-label" id="casa-jenny-label"></span>
            <span class="casa-row-value" id="casa-jenny-value"></span>
            <i class="ti ti-chevron-right casa-row-go" aria-hidden="true"></i>
          </button>
          <!-- Gli aggiornamenti. La riga porta la versione, quindi la riga muta
               che la scriveva in fondo alla pagina non serve piu': un numero e
               basta non e' un'impostazione, e' un'etichetta. -->
          <button class="casa-row" id="casa-row-updates" type="button">
            <i class="ti ti-refresh" aria-hidden="true"></i>
            <span class="casa-row-label" id="casa-updates-label"></span>
            <span class="casa-row-value" id="casa-updates-value"></span>
            <i class="ti ti-chevron-right casa-row-go" aria-hidden="true"></i>
          </button>
          <!-- Il backup. La riga porta **quando l'hai esportato**, non quando il
               telefono ha fatto l'ultimo snapshot: sono due cose diverse, e
               quella che la parola promette e' la prima. -->
          <button class="casa-row" id="casa-row-backup" type="button">
            <i class="ti ti-archive" aria-hidden="true"></i>
            <span class="casa-row-label" id="casa-backup-label"></span>
            <span class="casa-row-value" id="casa-backup-value"></span>
            <i class="ti ti-chevron-right casa-row-go" aria-hidden="true"></i>
          </button>
        </div>

        <!-- L'officina non sparisce: scende in fondo, come nella tavola. -->
        <button class="casa-workshop" id="casa-workshop" type="button">
          <i class="ti ti-tool" aria-hidden="true"></i>
          <span class="casa-workshop-text">
            <span class="casa-workshop-name" id="casa-workshop-name"></span>
            <span class="casa-workshop-hint" id="casa-workshop-hint"></span>
          </span>
          <i class="ti ti-chevron-right casa-row-go" aria-hidden="true"></i>
        </button>
      </div>
    </section>
    </div>
    </div>
  </div>

  <!-- ── La seconda stanza: le pagine di un quaderno ──────────────────────
       Wiki, grafo e progetti sono una cosa sola (v. la tavola `Concetto`), e
       questa e' quella cosa: due linguette sopra la stessa risposta del
       server — `/api/graph` porta nodi, archi e indice full-text insieme. -->
  <section class="casa-pages" id="casa-pages">
    <div class="casa-tabs" role="tablist">
      <button class="casa-tab is-on" id="casa-tab-list" type="button"
              role="tab" aria-selected="true" aria-controls="casa-page-list"></button>
      <button class="casa-tab" id="casa-tab-map" type="button"
              role="tab" aria-selected="false" aria-controls="casa-map"></button>
    </div>

    <label class="casa-search" for="casa-pages-q">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input class="casa-search-input" id="casa-pages-q" type="search"
             autocomplete="off" autocapitalize="none" spellcheck="false">
    </label>

    <!-- La nota sta **prima** dell'elenco: l'elenco e' `flex: 1`, quindi da
         vuoto si prende tutta l'altezza e spingerebbe «nessuna pagina con
         queste parole» sul bordo inferiore, dove sembra un piede di pagina
         invece che la risposta alla ricerca appena fatta. -->
    <div class="casa-pages-note" id="casa-pages-note" hidden></div>

    <div class="casa-page-list" id="casa-page-list" role="tabpanel"
         aria-labelledby="casa-tab-list"></div>

    <div class="casa-map" id="casa-map" role="tabpanel"
         aria-labelledby="casa-tab-map" hidden>
      <svg class="casa-map-svg" id="casa-map-svg" aria-hidden="true"></svg>
      <div class="casa-map-note" id="casa-map-note" hidden></div>
    </div>
  </section>

  <!-- ── La terza stanza: una pagina ──────────────────────────────────────
       L'HTML lo rende gia' il server (`/api/page`); qui si sanifica e si
       cablano i wikilink, che aprono un'altra pagina dello stesso quaderno.
       Audit, briciole di pane e LaTeX restano dell'officina. -->
  <section class="casa-reader" id="casa-reader">
    <article class="casa-reader-body" id="casa-reader-body"></article>
    <!-- Modifica: una textarea, e niente CodeMirror. Sono 200+ kB per colorare
         del markdown su 590 px, e la casa e' rimasta magra apposta. Il contatore
         di righe, il fold, la ricerca: nessuna di quelle cose serve a correggere
         un refuso in una nota che hai scritto tu.
         `spellcheck` spento come nell'editor dell'officina: sottolinea di rosso
         meta' di un testo tecnico, e la lingua qui non e' quella del sistema. -->
    <textarea class="casa-reader-edit" id="casa-reader-edit" hidden
              spellcheck="false" autocapitalize="sentences"></textarea>
    <!-- In basso e non nell'intestazione: sul Titan il pollice sta qui, e
         «Modifica» lassu' e' la porta d'ingresso, non il comando che si preme
         due volte. -->
    <div class="casa-reader-bar" id="casa-reader-bar" hidden>
      <button class="casa-reader-cancel" id="casa-reader-cancel" type="button"></button>
      <button class="casa-reader-save" id="casa-reader-save" type="button"></button>
    </div>

    <!-- «Segnala», e sta **in basso** e non appeso alla selezione. Un
         bottoncino flottante sopra il testo si contende il tocco con i manici
         di Chromium, che al trascinamento ri-derivano l'estremo fermo con un
         hit-test dalle proprie coordinate: se li' sotto c'e' della chrome,
         vince lei e la selezione salta (v. `shared/selection.js`). Qui il
         bottone e' fuori dal testo, e il problema non si pone. -->
    <div class="casa-reader-bar casa-sel-bar" id="casa-sel-bar" hidden>
      <button class="casa-reader-cancel" id="casa-sel-report" type="button"></button>
    </div>
  </section>


  <!-- Il foglio di «Segnala». `<dialog>` e non un pannello: `showModal()` lo
       mette nel top layer, cioe' sopra la mascotte — che in casa e' l'unico
       z-index che esista. -->
  <dialog class="oc-sheet casa-audit" id="casa-audit-dialog">
    <div class="oc-sheet-inner casa-audit-inner">
      <h2 class="casa-audit-title" id="casa-audit-title"></h2>
      <!-- Il testo scelto, come citazione: e' quel che l'ancora legherà, e
           vederlo prima di scrivere e' l'unico modo di accorgersi che la
           selezione ha preso una riga in piu'. -->
      <blockquote class="casa-audit-quote" id="casa-audit-quote"></blockquote>
      <textarea class="casa-audit-comment" id="casa-audit-comment" rows="3"></textarea>
      <div class="oc-dialog-buttons">
        <button class="oc-btn oc-btn-cancel" id="casa-audit-cancel" type="button"></button>
        <button class="oc-btn oc-btn-confirm" id="casa-audit-send" type="button"></button>
      </div>
    </div>
  </dialog>


  <!-- ── La quinta stanza: «Jenny» ────────────────────────────────────────
       Com'e' fatta — quanto e' grande, se si vede, se sta sopra le altre app.
       La classe e' `casa-jenny-room` e non `casa-jenny`: quella e' lo sprite
       di lei, che vive nel guscio da prima di questa stanza. -->
  <section class="casa-jenny-room" id="casa-jenny-room">
    <div class="casa-tu-scroll">

      <!-- Come si chiama. Era l'unica voce della «Personalizzazione»
           dell'officina che in casa non esistesse gia', e il 21/09/2026 quel
           gruppo e' sparito: senza questa scheda il nome lo si sarebbe potuto
           scegliere soltanto al primo avvio, una volta e per sempre.
           Sta in questa stanza e non in «Tu e Jenny» perche' qui c'e' gia' chi
           e' — le regole che le hai dato tu — e il nome e' la stessa domanda.
           Stessa forma della scheda delle regole: il «Salva» compare solo
           quando c'e' davvero qualcosa da salvare. -->
      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-signature" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-nome-label"></span>
          <button class="casa-save" id="casa-nome-save" type="button" hidden></button>
        </div>
        <input class="casa-rules casa-nome" id="casa-nome" type="text" maxlength="40"
               autocapitalize="words" autocomplete="off" spellcheck="false">
        <div class="casa-card-note" id="casa-nome-note"></div>
      </div>

      <div class="casa-rows">
        <div class="casa-row">
          <span class="casa-row-label" id="casa-jenny-visible-label"></span>
          <button class="casa-switch" id="casa-jenny-visible" type="button" role="switch">
            <span class="casa-switch-knob"></span>
          </button>
        </div>
        <div class="casa-row casa-row-stack">
          <span class="casa-row-label" id="casa-jenny-size-label"></span>
          <div class="casa-seg" id="casa-jenny-size" role="radiogroup"></div>
        </div>
        <!-- La finestra che sta sopra le altre app. Fuori da Android non puo'
             esistere, e la riga non c'e': `available` lo dice il server. -->
        <div class="casa-row" id="casa-jenny-floating-row" hidden>
          <span class="casa-row-label" id="casa-jenny-floating-label"></span>
          <button class="casa-switch" id="casa-jenny-floating" type="button" role="switch">
            <span class="casa-switch-knob"></span>
          </button>
        </div>
        <!-- La spiegazione sta **dentro** la scheda e non sotto: fuori sarebbe
             testo nudo, e a taglia grande le finirebbe addosso — le schede le
             passano davanti perche' sono opache, una riga di testo no. -->
        <div class="casa-card-note" id="casa-jenny-floating-note" hidden></div>
      </div>

      <!-- Chi e'. Non e' `SOUL.md` intero: e' **la tua parte** di quel file.
           Il resto lo tiene Dream, che lo riscrive circa una volta al giorno
           (misurato, v. `agent/soul_rules.py`) — quindi quel che scrivi qui
           vive altrove, in un file che nessuna passata puo' toccare, e dentro
           `SOUL.md` ne resta una copia rifatta dopo ogni passata. -->
      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-quote" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-rules-label"></span>
          <button class="casa-save" id="casa-rules-save" type="button" hidden></button>
        </div>
        <textarea class="casa-rules" id="casa-rules" rows="4" maxlength="2000"
                  autocapitalize="sentences" spellcheck="false"></textarea>
        <div class="casa-card-note" id="casa-rules-note"></div>
      </div>
    </div>
  </section>

  <!-- ── La sesta stanza: «Chi risponde» ─────────────────────────────────
       Le marche configurate, la chiave di quella guardata, e i modelli che
       quella marca dichiara. La tavola `Modello.dc.html`.

       **Toccare una mattonella non cambia chi risponde**: mostra i suoi
       modelli. Il cambio e' il tocco su un modello, e salva modello e
       provider **insieme** — v. `casa-model.js`. -->
  <section class="casa-model-room" id="casa-model-room">
    <div class="casa-tu-scroll">

      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-message-2" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-providers-label"></span>
          <span class="casa-card-value" id="casa-providers-value"></span>
        </div>
        <div class="casa-brands" id="casa-providers" role="radiogroup"></div>

        <!-- La chiave della marca **guardata**. Il suggerimento offuscato
             arriva dal server; la chiave vera non torna mai al client, quindi
             il campo parte vuoto e quel che non riscrivi resta com'e'. -->
        <div class="casa-key" id="casa-key-row" hidden>
          <span class="casa-key-label" id="casa-key-label"></span>
          <span class="casa-key-hint" id="casa-key-hint"></span>
          <button class="casa-key-btn" id="casa-key-btn" type="button"></button>
        </div>
        <div class="casa-key-edit" id="casa-key-edit" hidden>
          <input class="casa-key-input" id="casa-key-input" type="password"
                 autocomplete="off" autocapitalize="none" spellcheck="false">
          <button class="casa-save" id="casa-key-save" type="button"></button>
        </div>
      </div>

      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-cpu" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-models-label"></span>
        </div>
        <div class="casa-models" id="casa-models" role="radiogroup"></div>
        <div class="casa-card-note" id="casa-models-note" hidden></div>
      </div>

      <!-- Alcuni cambi valgono dal turno dopo, altri vogliono un riavvio: lo
           dice il payload, e va detto invece di lasciarlo indovinare. -->
      <div class="casa-card-note is-warn" id="casa-model-restart" hidden></div>
    </div>
  </section>

  <!-- ── La settima stanza: «Aggiornamenti» ──────────────────────────────
       La seconda vista di `shared/update-flow.js`. Il pallino dice il
       **meccanismo** e non la versione: verde vuol dire «il controllo
       funziona», non «sei aggiornata» — un manifest irraggiungibile da un mese
       mostrerebbe altrimenti la stessa schermata di chi lo e' davvero. -->
  <section class="casa-updates-room" id="casa-updates-room">
    <div class="casa-tu-scroll">

      <div class="casa-card">
        <div class="casa-card-head">
          <span class="casa-update-dot is-ok" id="casa-update-dot" aria-hidden="true"></span>
          <span class="casa-card-label" id="casa-update-headline"></span>
        </div>
        <div class="casa-card-note" id="casa-update-summary" hidden></div>
        <a class="casa-update-notes" id="casa-update-notes" target="_blank"
           rel="noopener" hidden></a>

        <!-- Quel che sta succedendo adesso. La nota sopravvive ai cambi di
             fase: dice cosa aspettarsi, la fase dice solo a che punto e'. -->
        <div class="casa-update-progress" id="casa-update-progress" hidden>
          <div class="casa-card-note" id="casa-update-note" hidden></div>
          <div class="casa-update-phase" id="casa-update-phase" hidden></div>
          <div class="casa-update-detail" id="casa-update-detail" hidden></div>
          <div class="casa-update-track" id="casa-update-track" hidden>
            <span class="casa-update-bar" id="casa-update-bar"></span>
          </div>
        </div>

        <button class="casa-save" id="casa-update-install" type="button" hidden></button>
      </div>

      <!-- Il meccanismo che dovrebbe trovarli, e che c'e' sempre — anche,
           soprattutto, quando non c'e' niente da installare. -->
      <div class="casa-card">
        <div class="casa-update-lines" id="casa-update-lines"></div>
        <button class="casa-key-btn" id="casa-update-check" type="button"></button>
      </div>
    </div>
  </section>

  <!-- ── L'ottava stanza: «Backup» ───────────────────────────────────────
       La terza vista di `shared/backup-flow.js` (le altre due: officina e
       onboarding). L'unica cosa nuova e' la data: «ultimo backup» non aveva
       nessuna fonte, in nessun file — v. `casa-backup.js`. -->
  <section class="casa-backup-room" id="casa-backup-room">
    <div class="casa-tu-scroll">

      <div class="casa-card">
        <div class="casa-card-head">
          <i class="ti ti-archive" aria-hidden="true"></i>
          <span class="casa-card-label" id="casa-backup-when"></span>
        </div>
        <div class="casa-card-note" id="casa-backup-export-note"></div>
        <button class="casa-save" id="casa-backup-export" type="button"></button>
      </div>

      <div class="casa-card" id="casa-backup-import-card">
        <div class="casa-card-note" id="casa-backup-import-note"></div>
        <button class="casa-key-btn" id="casa-backup-import" type="button"></button>
      </div>

      <!-- La storia locale: somiglia abbastanza da essere scambiata per un
           backup, e non lo e' — vive sullo stesso telefono. -->
      <div class="casa-card-note" id="casa-backup-snapshots"></div>
    </div>
  </section>

</main>

<script type="module" src="/html-mobile/assets/casa-app.js"></script>

<!-- Le schede di una voce del cassetto: tocco lungo su una riga.
     Stesso markup dell'officina, perche' e' lo stesso codice a riempirle
     (`shared/apps-actions.js`). Quella delle skill non c'e' piu' da nessuna
     parte: le skill non si lanciano, quindi nel cassetto non sono mai entrate,
     e la scheda che le gestiva e' stata cancellata il 21/09/2026. -->
<dialog class="oc-sheet" id="android-app-sheet">
  <div class="oc-sheet-inner">
    <div class="oc-sheet-title" id="android-app-title"></div>
    <div class="oc-sheet-actions" id="android-app-actions"></div>
    <button class="oc-sheet-cancel" id="android-app-cancel" data-i18n="common.cancel">Annulla</button>
  </div>
</dialog>

<dialog class="oc-sheet" id="jenny-app-sheet">
  <div class="oc-sheet-inner">
    <div class="oc-sheet-title" id="jenny-app-sheet-title"></div>
    <div class="oc-sheet-actions" id="jenny-app-sheet-actions"></div>
    <button class="oc-sheet-cancel" id="jenny-app-sheet-cancel" data-i18n="common.cancel">Annulla</button>
  </div>
</dialog>

<!-- La scheda di un quaderno: la pressione lunga nella pagina Quaderni. Gemella di quella qui sopra — stesso markup, stesse classi —
     perche' e' la stessa cosa detta per un'altra specie (v. casa-quaderno.js). -->
<dialog class="oc-sheet" id="casa-quaderno-sheet">
  <div class="oc-sheet-inner">
    <div class="oc-sheet-title" id="casa-quaderno-sheet-title"></div>
    <div class="oc-sheet-actions" id="casa-quaderno-sheet-actions"></div>
    <button class="oc-sheet-cancel" id="casa-quaderno-sheet-cancel" data-i18n="common.cancel">Annulla</button>
  </div>
</dialog>

</body>
</html>
