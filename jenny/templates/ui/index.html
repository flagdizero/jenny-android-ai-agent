<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Jenny</title>

<!-- Il guscio della casa. Serve una conversazione e nient'altro: qui dentro non
     entrano CodeMirror, KaTeX, Mermaid, D3 e highlight.js, che l'officina carica
     perche' le servono davvero. La differenza non e' estetica — e' il tempo che
     passa fra il tocco sull'icona e la prima riga leggibile.

     Vale la stessa CSP dell'officina (`script-src 'self'`, v. _SHELL_DOCUMENTS
     in jenny/webui/ws_http.py): nessuno script inline, nemmeno per il tema. -->

<!-- Pre-render: tema, lingua e taglia della mascotte prima del primo paint.
     Senza defer e in <head>, come nell'officina: e' l'unico modo perche' giri
     prima che il body si disegni. Lo stesso file, non una copia. -->
<script src="/html-mobile/assets/bootstrap.js"></script>

<link href="/html-mobile/assets/vendor/fonts/google-fonts.css" rel="stylesheet">
<link href="/html-mobile/assets/vendor/fonts/theme-fonts.css" rel="stylesheet">
<link rel="stylesheet" href="/html-mobile/assets/vendor/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">

<!-- Markdown e sanificazione: le risposte di Jenny sono markdown anche in casa.
     Sono le due sole librerie che il guscio si porta dietro. -->
<script src="/html-mobile/assets/vendor/marked@15.0.7/marked.min.js" defer></script>
<script src="/html-mobile/assets/vendor/dompurify@3/purify.min.js" defer></script>

<!-- I token di colore dei sette temi stanno in mobile-style.css, che e' anche il
     foglio dell'officina. La casa ne usa solo le variabili, e disegna il proprio
     con casa-style.css. -->
<link rel="stylesheet" href="/html-mobile/assets/mobile-style.css">
<link rel="stylesheet" href="/html-mobile/assets/casa-style.css">
</head>
<body class="casa">

<main class="casa-shell" data-view="chat">

  <!-- L'intestazione della tavola `Main.dc.html`, ridotta a cio' che esiste.
       Il titolo porta il chevron e apre «con chi parli»: la tendina che dice
       con quale conversazione stai parlando e quali quaderni ci sono. Il
       bottone a destra e' la porta per l'officina — nel disegno finale
       portera' a «Tu e Jenny», che quella porta se la tiene in fondo; finche'
       quella pagina non c'e', porta dritto dove deve portare, e l'icona lo
       dice.

       Il bottone sta *dentro* l'h1 e non attorno: un <button> accetta solo
       contenuto di frase, quindi un h1 dentro un bottone non e' markup valido
       — al contrario, ed e' l'unico modo di avere sia il titolo che il
       comando. -->
  <header class="casa-head">
    <div class="casa-title">
      <div class="casa-kicker" id="casa-kicker"></div>
      <!-- Nelle pagine l'occhiello e' la via d'uscita in alto. Un bottone a
           parte e non l'occhiello travestito: quello e' una parola, questo e'
           un comando, e un <div> con un gestore sopra e' un comando che la
           tastiera non trova. -->
      <button class="casa-back" id="casa-back" type="button" hidden>
        <i class="ti ti-chevron-left" aria-hidden="true"></i>
        <span id="casa-back-label"></span>
      </button>
      <h1>
        <button class="casa-who-open" id="casa-who" type="button"
                aria-haspopup="dialog" aria-expanded="false">
          <!-- Il pallino del quaderno aperto: stesso colore della sua riga nel
               pannello, ed e' l'unica cosa che lega il tocco alla stanza in cui
               sei finito. Nella conversazione personale non c'e': quella non e'
               un quaderno fra i quaderni. -->
          <span class="casa-who-dot casa-title-dot" id="casa-who-dot" hidden></span>
          <span class="casa-who-name">Jenny</span>
          <i class="ti ti-chevron-down" aria-hidden="true"></i>
        </button>
      </h1>
    </div>
    <!-- Cosa si puo' fare da qui. Cambia con la stanza: dalla chat di un
         quaderno si entra nelle sue pagine; dalle pagine si torna a parlarne.
         Sono due bottoni e non uno che cambia mestiere, perche' il mestiere lo
         dice l'icona e un bottone che ne cambia due volte non lo dice piu'. -->
    <div class="casa-actions">
      <button class="casa-pages-open" id="casa-pages-open" type="button" hidden>
        <i class="ti ti-book" aria-hidden="true"></i>
        <span id="casa-pages-count"></span>
      </button>
      <!-- La porta dell'officina. Nel disegno finale portera' a «Tu e Jenny»,
           che quella porta se la tiene in fondo; finche' quella pagina non c'e',
           porta dritto dove deve portare, e l'icona lo dice. -->
      <button class="casa-door" id="casa-door" type="button" aria-label="Officina">
        <i class="ti ti-tool"></i>
      </button>
      <!-- Dalle pagine: torna a parlarne. La tavola qui disegna il segno di
           Jenny; in casa quel segno e' il fiore, ed e' identita' — su un
           comando ci va l'icona di cio' che il comando fa. -->
      <button class="casa-talk" id="casa-talk" type="button" hidden>
        <i class="ti ti-message" aria-hidden="true"></i>
        <span id="casa-talk-label"></span>
      </button>
    </div>
  </header>

  <!-- La conversazione. Un solo filo, dall'alto verso il basso. -->
  <div class="casa-thread" id="casa-thread"></div>

  <!-- Lo stato vuoto sta FUORI dal filo, sovrapposto. Dentro sarebbe il primo
       figlio, e il primo figlio del filo porta il `margin-top:auto` che tiene
       una conversazione corta appoggiata al fondo: un nodo nascosto se lo
       prenderebbe lui, e i messaggi resterebbero incollati in cima. -->
  <div class="casa-empty" id="casa-empty" hidden>
    <div class="casa-empty-text" id="casa-empty-text"></div>
  </div>

  <!-- La riga di lavoro: cosa sta facendo Jenny, mentre lo fa. Tocco lungo per
       aprire lo stesso turno in officina, con pensieri, strumenti e tempi. -->
  <div class="casa-activity" id="casa-activity" hidden></div>

  <!-- Lo stato del filo: compare solo quando c'e' qualcosa da dire (rete giu',
       riconnessione). A filo funzionante non occupa spazio. -->
  <div class="casa-wire" id="casa-wire" hidden></div>

  <!-- Gli allegati in attesa di partire. Vuoto non occupa spazio. -->
  <div class="casa-pending" id="casa-pending" hidden></div>

  <div class="casa-composer">
    <label class="casa-field">
      <textarea class="casa-input" id="casa-input" rows="1" enterkeyhint="send" autocomplete="off"></textarea>
      <button class="casa-attach" id="casa-attach" type="button" aria-label="Allega">
        <i class="ti ti-paperclip"></i>
      </button>
    </label>
    <button class="casa-send" id="casa-send" type="button" aria-label="Manda">
      <i class="ti ti-arrow-up"></i>
    </button>
  </div>

  <!-- ── La seconda stanza: le pagine di un quaderno ──────────────────────
       Wiki, grafo e progetti sono una cosa sola (v. la tavola `Concetto`), e
       questa e' quella cosa: due linguette sopra la stessa risposta del
       server — `/api/graph` porta nodi, archi e indice full-text insieme. -->
  <section class="casa-pages" id="casa-pages">
    <div class="casa-tabs" role="tablist">
      <button class="casa-tab is-on" id="casa-tab-list" type="button"
              role="tab" aria-selected="true" aria-controls="casa-page-list"></button>
      <button class="casa-tab" id="casa-tab-map" type="button"
              role="tab" aria-selected="false" aria-controls="casa-map"></button>
    </div>

    <label class="casa-search" for="casa-pages-q">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input class="casa-search-input" id="casa-pages-q" type="search"
             autocomplete="off" autocapitalize="none" spellcheck="false">
    </label>

    <div class="casa-page-list" id="casa-page-list" role="tabpanel"
         aria-labelledby="casa-tab-list"></div>

    <div class="casa-map" id="casa-map" role="tabpanel"
         aria-labelledby="casa-tab-map" hidden>
      <svg class="casa-map-svg" id="casa-map-svg" aria-hidden="true"></svg>
      <div class="casa-map-note" id="casa-map-note" hidden></div>
    </div>

    <div class="casa-pages-note" id="casa-pages-note" hidden></div>
  </section>

  <!-- ── La terza stanza: una pagina ──────────────────────────────────────
       L'HTML lo rende gia' il server (`/api/page`); qui si sanifica e si
       cablano i wikilink, che aprono un'altra pagina dello stesso quaderno.
       Audit, briciole di pane e LaTeX restano dell'officina. -->
  <section class="casa-reader" id="casa-reader">
    <article class="casa-reader-body" id="casa-reader-body"></article>
  </section>

</main>

<script type="module" src="/html-mobile/assets/casa-app.js"></script>
</body>
</html>
